name: CD

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-cd.yml"
      - "lambdas/**"
      - "ruff.toml"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment halfway through.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      terraform: ${{ steps.terraform.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Terraform runs on manual dispatch, when there is no base to compare against, or when
      # anything under infra/ (or its workflow) changed.
      - id: terraform
        run: |
          base="${{ github.event.before }}"
          changed=true
          if [ "${{ github.event_name }}" = push ] && [ -n "$base" ] \
            && [ "$base" != 0000000000000000000000000000000000000000 ] \
            && git diff --quiet "$base" HEAD -- infra .github/workflows/terraform-cd.yml; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - id: detect
        run: |
          python .github/scripts/changed_lambdas.py \
            --base "${{ github.event.before }}" \
            --ecr-prefix "${{ vars.ECR_REPOSITORY_PREFIX }}" \
            --name-prefix "${{ vars.LAMBDA_NAME_PREFIX }}"

  # Infrastructure first: the lambdas only deploy once Terraform has applied (or had no changes).
  terraform:
    name: Terraform
    needs: detect
    if: needs.detect.outputs.terraform == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-cd.yml
    secrets: inherit

  deploy:
    name: ${{ matrix.lambda.name }}
    needs: [detect, terraform]
    # always() so a skipped terraform job does not skip the lambdas; a failed one does.
    if: >-
      always() && needs.detect.result == 'success'
      && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
      && needs.detect.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJSON(needs.detect.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/lambda-cd.yml
    with:
      lambda_path: ${{ matrix.lambda.path }}
      ecr_repository: ${{ matrix.lambda.ecr_repository }}
      function_name: ${{ matrix.lambda.function_name }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
