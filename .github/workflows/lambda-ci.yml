name: Lambda CI

on:
  workflow_call:
    inputs:
      lambda_path:
        description: Directory of the lambda (contains Dockerfile, requirements-dev.txt and tests/)
        required: true
        type: string

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.lambda_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ inputs.lambda_path }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.lambda_path }}
          file: ${{ inputs.lambda_path }}/Dockerfile
          push: false
          provenance: false
          platforms: linux/amd64
          tags: lambda-ci:local
